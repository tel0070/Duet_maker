name: Build local-engine Windows Executable

# Manual only (workflow_dispatch): this bundles Demucs/basic-pitch/torch/
# tensorflow into one .exe via PyInstaller, which is slow and occasionally
# flaky, so it isn't run on every push — trigger it explicitly when
# local-engine's dependencies or app_entry.py actually change. Must run on
# windows-latest: a Windows .exe cannot be cross-compiled from Linux/macOS.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-engine
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install web app dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        # This is what makes the exe open to an actual working screen
        # instead of a bare headless API — see the "Copy" step below and
        # main.py's StaticFiles mount. VITE_BASE_PATH=/ because this is
        # served from local-engine's own root, not a GitHub Pages subpath.
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @duet-maker/web build
        env:
          VITE_BASE_PATH: /

      - name: Copy the built web app into local-engine/static
        shell: pwsh
        run: Copy-Item -Path "..\apps\web\dist" -Destination "static" -Recurse -Force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch first
        # Avoids pulling a multi-GB CUDA build as a side effect of demucs's
        # torch dependency — see local-engine/README.md's install-size note.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install local-engine + PyInstaller
        # requirements-build.txt is the single source of truth for these
        # pins, so a version bump doesn't need editing in two places.
        # backports.tarfile is installed explicitly: pkg_resources's
        # PyInstaller runtime hook imports jaraco.context, which on
        # Python < 3.12 imports backports.tarfile as a shim for a
        # tarfile-extraction-filter API that version added — it's a
        # separate PyPI distribution from the `backports` namespace
        # itself, so `--collect-all backports` alone has nothing to
        # collect unless this is actually installed first (confirmed via
        # a real build log: "WARNING: collect_dynamic_libs - skipping
        # library collection for module 'backports' as it is not a
        # package" — a bare empty namespace dir, not the real submodule).
        run: |
          pip install -r requirements-build.txt
          pip install backports.tarfile

      - name: Download static ffmpeg + ffprobe (Windows, LGPL build)
        # demucs.audio.AudioFile loads every input file - wav included - by
        # shelling out to the literal `ffmpeg`/`ffprobe` command names via
        # subprocess + PATH lookup. Confirmed by actually running
        # demucs.separate.main() against a synthetic file with neither
        # binary present: it fails with "No such file or directory:
        # 'ffprobe'", and demucs's own fallback to torchaudio also fails
        # (this pinned torchaudio version needs the separate, unbundled
        # `torchcodec` package to load ANY format). Windows has no ffmpeg
        # preinstalled, and this exe must work with zero setup, so both
        # binaries are bundled directly. The LGPL build (not GPL) is enough
        # - audio *decoding* (mp3/wav/etc.) uses ffmpeg's built-in native
        # decoders, not the GPL-only encoders this app never needs.
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          New-Item -ItemType Directory -Force -Path ffmpeg-bin | Out-Null
          $ffmpegExe = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "ffmpeg-bin\ffmpeg.exe"
          Copy-Item -Path (Join-Path $ffmpegExe.DirectoryName "ffprobe.exe") -Destination "ffmpeg-bin\ffprobe.exe"

      - name: Build standalone executable
        # --onedir, not --onefile: a --onefile build has to re-extract its
        # ~550MB payload to a fresh temp directory on every single launch
        # before any Python code (even a print()) runs — with this many
        # heavy dependencies bundled, that looks exactly like a frozen
        # black window with a blinking cursor and no output for minutes.
        # --onedir unpacks once at build time, so launching is near-instant.
        # `--collect-all backports.tarfile`: without it, the frozen exe
        # crashes on launch with "ModuleNotFoundError: No module named
        # 'backports'" before any of our own code runs — confirmed by a
        # real user running the previous build from a terminal to see
        # the traceback (double-clicking just closes the window on crash,
        # too fast to read).
        # `--collect-all scipy`: same class of bug, different package —
        # confirmed by the SAME real user's next terminal run:
        # "ModuleNotFoundError: No module named 'scipy._cyutility'" while
        # importing mir_eval -> scipy. `_cyutility` is a Cython-3-era
        # internal helper module scipy's compiled extensions share; the
        # pyinstaller-hooks-contrib version pinned here predates it, so
        # its scipy hook doesn't know to include it and the plain
        # --collect-submodules pass misses it too. `--collect-all`
        # forces every file in, hidden compiled helpers included.
        # `--collect-all sklearn`: not yet confirmed broken, but scikit-learn
        # is already pulled in transitively (some dependency imports it)
        # and shares scipy's Cython-compiled-extension setup, so it's the
        # next most likely place for the exact same bug — added
        # preemptively to avoid a third round-trip for the same root cause.
        run: >
          pyinstaller --onedir --name duet-maker-local-engine
          --collect-all torch
          --collect-all torchaudio
          --collect-all demucs
          --collect-all basic_pitch
          --collect-all librosa
          --collect-all resampy
          --collect-all backports.tarfile
          --collect-all scipy
          --collect-all sklearn
          --add-data "static;static"
          --add-binary "ffmpeg-bin\ffmpeg.exe;ffmpeg_bin"
          --add-binary "ffmpeg-bin\ffprobe.exe;ffmpeg_bin"
          app_entry.py

      - name: Remove vendored license trees (fixes "Destination Path Too Long" on extraction)
        # torch bundles a `licenses/` subfolder inside its .dist-info that
        # recursively vendors *other* projects' third-party license texts
        # (torch -> kineto -> libkineto -> dynolog -> prometheus-cpp ->
        # civetweb -> duktape, etc.) — plain copyright text, never imported
        # by any code, but nested 6-7 directories deep. A real user hit
        # exactly this: Windows' built-in zip extractor refuses to extract
        # it once the destination path passes ~260 characters. Deleting
        # any `licenses` folder directly under a `*.dist-info` directory
        # removes only that dead weight, not any actual runtime code.
        shell: pwsh
        run: >
          Get-ChildItem -Path "dist\duet-maker-local-engine\_internal" -Filter "licenses" -Recurse -Directory -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match "\.dist-info[\\/]licenses$" } |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item -Path $_.FullName -Recurse -Force }

      - name: Remove torch's C++ headers (build-time only, ~37MB/9000+ files, not needed to run)
        # torch/include/ is for compiling custom C++/CUDA extensions
        # against torch — irrelevant to just running inference, and its
        # deeply-templated ATen header filenames are another source of
        # near-260-character paths.
        shell: pwsh
        run: >
          if (Test-Path "dist\duet-maker-local-engine\_internal\torch\include") {
            Remove-Item -Path "dist\duet-maker-local-engine\_internal\torch\include" -Recurse -Force
          }

      - name: Upload executable folder (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: duet-maker-local-engine-windows
          path: local-engine/dist/duet-maker-local-engine/
          retention-days: 14

      - name: Zip the build output
        run: Compress-Archive -Path dist\duet-maker-local-engine -DestinationPath dist\duet-maker-local-engine-windows.zip

      - name: Publish as a public GitHub Release
        # Actions artifacts (the step above) require a GitHub sign-in to
        # download, and their download link is easy to miss — Release
        # assets are a plain public URL, no login needed, which is what an
        # end user actually wants. Reuses one rolling tag/release so the
        # download link stays stable across rebuilds instead of piling up
        # a new release every run.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-engine-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create local-engine-latest \
            "dist/duet-maker-local-engine-windows.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "local-engine standalone (Windows, auto-built)" \
            --notes "Automatically built by .github/workflows/build-local-engine-exe.yml from commit ${{ github.sha }}. Unzip, then run duet-maker-local-engine.exe from inside the extracted duet-maker-local-engine folder (it needs the files next to it — don't move the .exe out on its own). See local-engine/README.md."
