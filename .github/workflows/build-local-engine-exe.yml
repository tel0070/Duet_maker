name: Build local-engine Windows Executable

# Manual only (workflow_dispatch): this bundles Demucs/basic-pitch/torch/
# tensorflow into one .exe via PyInstaller, which is slow and occasionally
# flaky, so it isn't run on every push — trigger it explicitly when
# local-engine's dependencies or app_entry.py actually change. Must run on
# windows-latest: a Windows .exe cannot be cross-compiled from Linux/macOS.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch first
        # Avoids pulling a multi-GB CUDA build as a side effect of demucs's
        # torch dependency — see local-engine/README.md's install-size note.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install local-engine + PyInstaller
        # requirements-build.txt is the single source of truth for these
        # pins, so a version bump doesn't need editing in two places.
        run: pip install -r requirements-build.txt

      - name: Build standalone executable
        # --onedir, not --onefile: a --onefile build has to re-extract its
        # ~550MB payload to a fresh temp directory on every single launch
        # before any Python code (even a print()) runs — with this many
        # heavy dependencies bundled, that looks exactly like a frozen
        # black window with a blinking cursor and no output for minutes.
        # --onedir unpacks once at build time, so launching is near-instant.
        run: >
          pyinstaller --onedir --name duet-maker-local-engine
          --collect-all torch
          --collect-all torchaudio
          --collect-all demucs
          --collect-all basic_pitch
          --collect-all librosa
          --collect-all resampy
          app_entry.py

      - name: Upload executable folder (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: duet-maker-local-engine-windows
          path: local-engine/dist/duet-maker-local-engine/
          retention-days: 14

      - name: Zip the build output
        run: Compress-Archive -Path dist\duet-maker-local-engine -DestinationPath dist\duet-maker-local-engine-windows.zip

      - name: Publish as a public GitHub Release
        # Actions artifacts (the step above) require a GitHub sign-in to
        # download, and their download link is easy to miss — Release
        # assets are a plain public URL, no login needed, which is what an
        # end user actually wants. Reuses one rolling tag/release so the
        # download link stays stable across rebuilds instead of piling up
        # a new release every run.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-engine-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create local-engine-latest \
            "dist/duet-maker-local-engine-windows.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "local-engine standalone (Windows, auto-built)" \
            --notes "Automatically built by .github/workflows/build-local-engine-exe.yml from commit ${{ github.sha }}. Unzip, then run duet-maker-local-engine.exe from inside the extracted duet-maker-local-engine folder (it needs the files next to it — don't move the .exe out on its own). See local-engine/README.md."
