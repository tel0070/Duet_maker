name: Scheduled Health Check

on:
  schedule:
    # Every Monday 03:00 UTC. Catches dependency/toolchain bit-rot even when
    # nobody has opened a PR recently — not a deployment gate.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full validation
        run: pnpm validate
